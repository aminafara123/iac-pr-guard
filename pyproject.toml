[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iac-pr-guard"
version = "0.1.0"
description = "Infrastructure-as-Code security guard for pull requests: scan Terraform, post a PR-style review, and fail CI on high findings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com" }]
keywords = ["terraform", "security", "devsecops", "iac", "ci", "aws", "sarif"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []  # runtime is standard library only

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
iac-pr-guard = "iac_pr_guard.cli:main"

[project.urls]
Homepage = "https://github.com/aminafara123/iac-pr-guard"

[tool.hatch.build.targets.wheel]
# Includes the iac_pr_guard package and its bundled samples/ data used by --demo.
packages = ["iac_pr_guard"]

[tool.pytest.ini_options]
pythonpath = ["."]
